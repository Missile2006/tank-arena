name: Release Docker image to GHCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build browser and server
        run: |
          npm run build -w tank-arena-client
          npm run build -w tank-arena-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build local image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tank-arena:lab8
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Start local container
        run: docker compose up -d --no-build

      - name: Wait for readiness
        shell: bash
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail 100
          exit 1

      - name: Verify git SHA and run smoke tests
        shell: bash
        run: |
          node -e 'fetch("http://127.0.0.1:3000/health").then(r=>r.json()).then(h=>{if(h.gitSha!==process.env.GITHUB_SHA)process.exit(1)}).catch(()=>process.exit(1))'
          node tests/lab8-smoke.mjs

      - name: Show logs if checks fail
        if: failure()
        run: docker compose logs --tail 150

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Publish release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
